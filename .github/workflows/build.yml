name: build-probe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang lld cmake ninja-build curl xz-utils python3

      - name: Recuperer le SDK PS5
        run: |
          set -e
          git clone --depth 1 https://github.com/john-tornblom/ps5-payload-sdk "$HOME/sdk"
          cd "$HOME/sdk"
          if [ -f build.sh ]; then chmod +x build.sh; ./build.sh; else make; fi

      - name: Verifier le SDK
        run: |
          ls -l "$HOME/sdk/bin" || true

      - name: Compiler le payload
        env:
          PS5_PAYLOAD_SDK: /home/runner/sdk
        run: make

      - name: Verifier le resultat
        run: ls -lh kstuff-probe.elf

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: kstuff-probe.elf
          path: kstuff-probe.elf
