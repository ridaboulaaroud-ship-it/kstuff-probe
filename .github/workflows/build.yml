
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer les dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y bash socat cmake meson pkg-config xxd wget curl unzip \
            python3 python3-pyelftools libssl-dev zlib1g-dev

      - name: Installer le SDK PS5 officiel
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip \
            -O "$RUNNER_TEMP/ps5-payload-sdk.zip"
          sudo unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d /opt
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Verifier le SDK
        run: |
          test -f "$PS5_PAYLOAD_SDK/toolchain/prospero.mk" || \
          test -f "$PS5_PAYLOAD_SDK/lib/prospero.mk"
          find "$PS5_PAYLOAD_SDK" -maxdepth 3 \
            \( -name 'prospero-clang' -o -name 'prospero.mk' \) -print

      - name: Compiler le payload
        run: make

      - name: Verifier le resultat
        run: |
          test -s kstuff-probe.elf
          file kstuff-probe.elf

      - name: Publier l artefact
        uses: actions/upload-artifact@v4
        with:
          name: kstuff-probe-elf
          path: kstuff-probe.elf
          if-no-files-found: error
