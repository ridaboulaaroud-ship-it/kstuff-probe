name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer les dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y bash socat cmake pkg-config xxd wget curl \
            python3 python3-pyelftools libssl-dev zlib1g-dev
          sudo apt-get install -y clang-15 lld-15 llvm-15 || sudo apt-get install -y clang lld llvm
          if command -v llvm-config-15 >/dev/null 2>&1; then
            echo "LLVM_CONFIG=llvm-config-15" >> "$GITHUB_ENV"
          fi

      - name: Recuperer le SDK PS5
        run: |
          git clone --depth 1 https://github.com/ps5-payload-dev/sdk.git "$GITHUB_WORKSPACE/sdk"

      - name: Compiler le SDK PS5
        run: |
          make -C "$GITHUB_WORKSPACE/sdk"
          make -C "$GITHUB_WORKSPACE/sdk" DESTDIR="$GITHUB_WORKSPACE/ps5sdk" install
          echo "PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/ps5sdk" >> "$GITHUB_ENV"

      - name: Compiler le payload
        run: make

      - name: Verifier le resultat
        run: |
          ls -l kstuff-probe.elf
          file kstuff-probe.elf || true

      - name: Publier l artefact
        uses: actions/upload-artifact@v4
        with:
          name: kstuff-probe-elf
          path: kstuff-probe.elf
          if-no-files-found: error
